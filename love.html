<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You Amelia</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#667eea);
    position:relative;
}

/* Background tulisan */
.bg-text{
    position:absolute;
    font-size:90px;
    font-weight:bold;
    color:rgba(255,255,255,0.08);
    transform:rotate(-25deg);
    user-select:none;
}

/* Kotak utama */
.container{
    width:90%;
    max-width:400px;
    padding:35px;
    text-align:center;
    color:white;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
    z-index:2;
}

.heart{
    font-size:70px;
    animation:denyut 1s infinite;
}

@keyframes denyut{
    50%{
        transform:scale(1.2);
    }
}

h1{
    margin:15px 0;
    font-size:28px;
}

p{
    font-size:15px;
    line-height:1.7;
}

.name{
    margin-top:25px;
    font-size:20px;
    font-weight:bold;
    color:#ffe600;
    text-shadow:0 0 10px #fff;
}

button{
    margin-top:25px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4b8b;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

/* HP */
@media(max-width:480px){
    .bg-text{
        font-size:55px;
    }

    h1{
        font-size:23px;
    }
}

</style>

</head>

<body>

<div class="bg-text">
LOVE
</div>

<div class="container">

<div class="heart">
❤️
</div>

<h1>
I LOVE YOU
</h1>

<p>
Sebuah halaman kecil yang dibuat dengan penuh rasa sayang.
Semoga senyummu selalu indah dan hari-harimu selalu bahagia.
</p>

<div class="name">
AMELIA RAMADANI PUTRI ❤️
</div>

<button onclick="love()">
Klik Aku
</button>

</div>


<script>
function love(){
    alert("❤️ I LOVE YOU AMELIA RAMADANI PUTRI ❤️");
}
</script>

</body>
</html>
